<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator okienek na taśmie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#555555">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#222}
  label{display:block;margin:.8rem 0 .2rem;font-weight:600}
  input{width:100%;padding:.5rem;font-size:1rem;box-sizing:border-box}
  .res{background:#eef6ee;border-radius:8px;padding:1rem;margin-top:1.2rem}
  .res strong{font-size:1.2rem}
  ol{padding-left:1.2rem;line-height:1.6}
  .err{color:#b00020}
  .row{display:flex;gap:.5rem}
  button{font-size:1.2rem;padding:0 .8rem;cursor:pointer}
  input:read-only{background:#e8e8e8}
</style>
</head>
<body>
<h1>Kalkulator okienek</h1>
<label>Długość taśmy (mm)<input id="tape" type="number" step="any" value="19237"></label>
<label>Szerokość okienka (mm)</label>
<div class="row"><input id="win" type="number" step="any" value="400"><button id="lock" type="button" title="Zablokuj wymiar">🔓</button></div>
<label>Szerokość linii (mm) – podaj wartość wyjściową, po obliczeniu pokaże wynik<input id="line" type="number" step="any" value="60"></label>
<div id="out" class="res"></div>
<script>
const $ = id => document.getElementById(id);
const f = (x, d = 3) => String(+x.toFixed(d)).replace('.', ',');

let baseLine = parseFloat($('line').value);

function calc() {
  const L = parseFloat($('tape').value), w = parseFloat($('win').value), l = baseLine;
  const out = $('out');
  if (!(L > 0 && w > 0 && l >= 0) || L < w + l) {
    out.innerHTML = '<span class="err">Podaj poprawne wartości (taśma musi być dłuższa niż okienko z linią).</span>';
    return;
  }
  const step = w + l;
  const exact = L / step;
  const n = Math.floor(exact);
  const used = step * n;
  const rest = L - used;
  const add = Math.round(rest / n * 10) / 10; // zaokrąglenie do 0,1 mm jak w przykładzie
  const newStep = w + add + l;
  const check = newStep * n;
  if (document.activeElement !== $('line')) $('line').value = +(l + add).toFixed(1);
  out.innerHTML = `
    <p>Szerokość okienka: <strong>${f(w)} mm</strong><br>
    Liczba pełnych okienek: <strong>${n}</strong></p>
    <h3>Podgląd graficzny</h3>${draw(w, l + add, n)}`;
}

function draw(w, line, n) {
  const W = Math.max(280, Math.floor($('out').clientWidth - 32));
  const k = Math.min(n, W < 500 ? 2 : W < 800 ? 3 : 4);
  const total = k * w + (k + 1) * line;
  const s = W / total, fs = W < 500 ? 14 : 16;
  const top = 50, h = W < 500 ? 90 : 120, H = top + h + 120;
  const bottom = top + h;
  let x = 0, g = `<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c00"/></marker></defs>`;
  // wymiar: linie pomocnicze od krawędzi w dół + strzałka między nimi
  const dim = (x1, x2, y, text, anchor = 'middle') => {
    const tx = anchor === 'start' ? x1 : anchor === 'end' ? x2 : (x1 + x2) / 2;
    return `<line x1="${x1}" y1="${bottom}" x2="${x1}" y2="${y + 6}" stroke="#c00" stroke-dasharray="3 2"/>
     <line x1="${x2}" y1="${bottom}" x2="${x2}" y2="${y + 6}" stroke="#c00" stroke-dasharray="3 2"/>
     <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#c00" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
     <text x="${tx}" y="${y - 6}" font-size="${fs}" font-weight="600" text-anchor="${anchor}" fill="#222">${text}</text>`;
  };
  g += `<rect x="0" y="${top}" width="${W}" height="${h}" fill="#555"/>`;
  for (let i = 0; i <= k; i++) {
    const lx = x;
    x += line * s;
    g += dim(lx, x, bottom + 85, f(line, 1) + ' mm', i === 0 ? 'start' : i === k ? 'end' : 'middle');
    if (i === k) break;
    g += `<rect x="${x}" y="${top}" width="${w * s}" height="${h}" fill="#fff" stroke="#222" stroke-width="2"/>`;
    g += `<text x="${x + w * s / 2}" y="${top + h / 2 + 8}" font-size="${fs + 8}" text-anchor="middle">${i + 1}</text>`;
    g += dim(x, x + w * s, bottom + 40, f(w, 1) + ' mm');
    x += w * s;
  }
  g += `<text x="${W}" y="${top - 12}" font-size="${fs}" text-anchor="end">${n > k ? '… (razem ' + n + ' okienek)' : 'razem ' + n + ' okienek'}</text>`;
  g += `<text x="0" y="${top - 12}" font-size="${fs - 2}" fill="#555">szary = linia, biały = okienko</text>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="border:1px solid #ccc;background:#fafafa">${g}</svg>`;
}
$('lock').addEventListener('click', () => {
  const locked = !$('win').readOnly;
  $('win').readOnly = locked;
  $('lock').textContent = locked ? '🔒' : '🔓';
  $('lock').title = locked ? 'Odblokuj wymiar' : 'Zablokuj wymiar';
});
['tape', 'win'].forEach(id => $(id).addEventListener('input', calc));
$('line').addEventListener('input', () => { baseLine = parseFloat($('line').value); calc(); });
$('line').addEventListener('blur', calc);
window.addEventListener('resize', calc);
calc();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
